services:
  - type: web
    name: marrow-books
    runtime: node
    plan: free
    buildCommand: npm --prefix server ci && npm --prefix client ci && npm --prefix client run build
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
